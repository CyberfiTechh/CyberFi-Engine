name: Build and verify Windows Agent

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string

permissions:
    contents: read

jobs:
    native:
        name: Native ${{ matrix.component }}
        runs-on: windows-2025
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include:
                    - component: monty
                      script: packages/happy-agent/scripts/build-native-monty.mjs
                      source: packages/happy-agent/native/monty/**
                      output: packages/happy-agent-modules/native/target/win32-x64
                    - component: fff
                      script: packages/happy-agent/scripts/build-native-fff.mjs
                      source: packages/happy-agent/native/fff/**
                      output: packages/happy-agent/native/target/win32-x64
                    - component: libsql
                      script: packages/happy-agent/scripts/build-native-libsql.mjs
                      source: packages/happy-agent/native/libsql/**
                      output: packages/happy-agent/native/target/win32-x64
                    - component: sandbox
                      script: packages/happy-agent-supervisor/scripts/build-native-windows.mjs
                      source: packages/happy-agent-supervisor/native/windows/**
                      output: packages/happy-agent-supervisor/native/target/release
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  repository: slopus/happy-agent
                  ref: 3d672e414d70804cf9f1b20b44d7243c78e063c3
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              if: matrix.component == 'sandbox'
              with:
                  path: cyberfi-overlay
                  persist-credentials: false
            - name: Apply CyberFi changes to the pinned native sandbox patch
              if: matrix.component == 'sandbox'
              run: |
                  $patch = 'cyberfi-overlay/branding/windows-managed-command-tools.patch'
                  git apply --check $patch
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  git apply $patch
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Cache native outputs by pinned source and builder
              id: native-cache
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ matrix.output }}
                  # Bump the cache version when changing the compiler setup below. Package-only
                  # changes reuse native outputs; every run still tests the final binary.
                  key: windows-gnu-rust195-v2-${{ matrix.component }}-${{ hashFiles('.gitattributes', matrix.source, matrix.script, 'packages/happy-agent/scripts/assertWindowsSystemImports.mjs', 'cyberfi-overlay/branding/windows-managed-command-tools.patch') }}
            - name: Install GNU native build tools
              if: steps.native-cache.outputs.cache-hit != 'true'
              id: msys2
              uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
              with:
                  msystem: MINGW64
                  install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make
            - name: Select the pinned Windows toolchain
              if: steps.native-cache.outputs.cache-hit != 'true'
              env:
                  MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
              run: |
                  "$env:MSYS2_LOCATION\mingw64\bin" >> $env:GITHUB_PATH
                  "$env:MSYS2_LOCATION\usr\bin" >> $env:GITHUB_PATH
                  rustup toolchain install 1.95.0-x86_64-pc-windows-gnu --profile minimal
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Build pinned source and verify native imports
              if: steps.native-cache.outputs.cache-hit != 'true'
              env:
                  BUILD_SCRIPT: ${{ matrix.script }}
                  CARGO_BUILD_JOBS: "2"
                  CMAKE_GENERATOR: MinGW Makefiles
              run: node $env:BUILD_SCRIPT
            - name: Stage native files with their repository paths
              env:
                  NATIVE_OUTPUT: ${{ matrix.output }}
              run: |
                  $destination = Join-Path native-stage $env:NATIVE_OUTPUT
                  New-Item -ItemType Directory -Force -Path $destination | Out-Null
                  Copy-Item -Path "$env:NATIVE_OUTPUT\*" -Destination $destination
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: windows-native-${{ matrix.component }}
                  path: native-stage/
                  if-no-files-found: error
                  retention-days: 7

    package:
        name: Package and exercise standalone Agent
        permissions:
            contents: read
            id-token: write
        needs: native
        runs-on: windows-2025
        timeout-minutes: 60
        env:
            HAPPY_AGENT_RELEASE_VERSION: ${{ inputs.version }}
            HAPPY_WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
            WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
            WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
            WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
            WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  repository: slopus/happy-agent
                  ref: 3d672e414d70804cf9f1b20b44d7243c78e063c3
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Locate the pnpm store
              id: pnpm-store
              shell: bash
              run: |
                  echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
                  echo "abi=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
                  echo "image=$(node -p '[process.env.ImageOS, process.env.ImageVersion].join("-")')" >> "$GITHUB_OUTPUT"
            - name: Cache dependency downloads
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.pnpm-store.outputs.abi }}-${{ steps.pnpm-store.outputs.image }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'patches/**') }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: windows-native-*
                  merge-multiple: true
            - name: Install dependencies
              # Cache downloads only; patched native addons must run their install scripts again.
              run: pnpm install --frozen-lockfile --config.side-effects-cache=false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  path: cyberfi-overlay
                  persist-credentials: false
            - name: Apply CyberFi tray and voice defaults before compiling JavaScript
              run: |
                  ./cyberfi-overlay/windows/Markala-Windows-Tepsisi.ps1 -EngineSource .
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node cyberfi-overlay/branding/patch-compute-sdk.mjs --self-check
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node cyberfi-overlay/branding/patch-compute-sdk.mjs .
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Verify MCP names, optional searches and narrow command runtime permissions
              run: |
                  node --test cyberfi-overlay/branding/command-tool-read-policy.test.mjs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  pnpm --filter @slopus/happy-agent-modules exec vitest run tests/mcp/McpProtocolServerNames.test.ts tests/mcp/McpModule.test.ts tests/systemPrompt/SystemPromptWindows.test.ts tests/compute/impl/readComputeTextFile.test.ts tests/compute/claude/claudeComputeSurface.test.ts tests/compute/grok/grokComputeToolSurface.test.ts tests/mcp/McpToolSerialization.test.ts tests/mcp/McpResultCornerCases.test.ts tests/search tests/compute/CyberFiCommandToolReadPolicy.test.ts tests/compute/CyberFiCommandToolsReady.test.ts --maxWorkers=2
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Verify human Full access inheritance and queued human restrictions
              run: |
                  pnpm --filter @slopus/happy-agent-modules exec vitest run tests/collaboration/CollaborationModule.test.ts tests/subtasks/SubtaskPermissionModes.test.ts -t 'collaborator permission modes|subtask permission modes' --maxWorkers=2
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Verify archival preserves unregistered worktree files
              run: pnpm --filter @slopus/happy-agent-modules exec vitest run tests/workspaces/WorkspaceArchiveStopsWork.test.ts --maxWorkers=1
            - name: Build workspace JavaScript
              run: pnpm build
            - name: Verify source named-pipe transports before signing and compiling
              run: |
                  pnpm --filter @slopus/happy-agent exec pnpm dlx bun@1.4.4 scripts/verify-windows-sockets.ts
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Authenticate signing with GitHub OIDC
              if: env.HAPPY_WINDOWS_SIGNING_ENABLED == 'true'
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Install the pinned Artifact Signing module
              if: env.HAPPY_WINDOWS_SIGNING_ENABLED == 'true'
              run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser
            - name: Sign rebuilt sandbox executables when signing is enabled
              if: env.HAPPY_WINDOWS_SIGNING_ENABLED == 'true'
              run: ./scripts/sign-windows-files.ps1 -Directory packages/happy-agent-supervisor/native/target/release
            - name: Stage the rebuilt sandbox for native tests and embedding
              run: node cyberfi-overlay/branding/stage-windows-sandbox.mjs stage
            - name: Select the built libsql binding for native regression checks
              run: |
                  @'
                  const { copyFileSync, unlinkSync } = require('node:fs');
                  const { createRequire } = require('node:module');
                  const { resolve } = require('node:path');
                  const agent = createRequire(resolve('packages/happy-agent/package.json'));
                  const modules = createRequire(agent.resolve('@slopus/happy-agent-modules'));
                  const client = createRequire(modules.resolve('@libsql/client'));
                  const libsql = createRequire(client.resolve('libsql'));
                  // Detach the installed hardlink before replacing it; never change a cached store file.
                  const destination = libsql.resolve('@libsql/win32-x64-msvc');
                  unlinkSync(destination);
                  copyFileSync('packages/happy-agent/native/target/win32-x64/libsql.node', destination);
                  '@ | node
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Verify voice settings and custom prompt preservation
              run: pnpm --filter @slopus/happy-agent-modules exec vitest run tests/liveModule.test.ts tests/config/liveConfiguration.test.ts tests/skills/CyberFiSkillsReadPolicy.test.ts
            - name: Verify patched Parcel callback lifetimes under Node and Bun
              run: pnpm --filter @slopus/happy-agent test:native:watcher

            - name: Verify the Bun runtime before compiling
              run: pnpm --filter @slopus/happy-agent test:bun:runtime

            - name: Verify both bundle inputs use the patched Windows ACL timeout
              run: node cyberfi-overlay/branding/patch-compute-sdk.mjs . --verify

            - name: Build standalone executable with signed embedded native assets when enabled
              run: pnpm --filter @slopus/happy-agent build:bun --target win32-x64
            - name: Verify compiled CyberFi tray icon and product metadata
              run: |
                  node cyberfi-overlay/branding/verify.mjs . win32
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node cyberfi-overlay/branding/patch-compute-sdk.mjs . --verify
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $tray = Get-Item packages/happy-agent-modules/dist/menuBar/bin/happy-menu-bar-win32-x64.exe
                  $expectedFileVersion = ($env:HAPPY_AGENT_RELEASE_VERSION -split '-')[0] + '.0'
                  if ($tray.VersionInfo.ProductName -ne 'CyberFi' -or $tray.VersionInfo.FileVersion -ne $expectedFileVersion -or $tray.VersionInfo.ProductVersion -ne $env:HAPPY_AGENT_RELEASE_VERSION) { throw 'Native tray metadata mismatch' }
            - name: Verify all rebuilt sandbox hashes in the compiled executable
              run: node cyberfi-overlay/branding/stage-windows-sandbox.mjs verify
            - name: Sign and verify the standalone executable
              if: env.HAPPY_WINDOWS_SIGNING_ENABLED == 'true'
              run: ./scripts/sign-windows-files.ps1 -Directory packages/happy-agent/dist/bin
            - name: Verify native libraries
              run: |
                  pnpm --filter @slopus/happy-agent test:native:monty
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node --expose-gc packages/happy-agent/scripts/verify-native-libsql.mjs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  pnpm --filter @slopus/happy-agent exec pnpm dlx bun@1.4.4 scripts/verify-native-libsql.mjs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  node packages/happy-agent/scripts/verify-native-fff.mjs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  pnpm --filter @slopus/happy-agent exec pnpm dlx bun@1.4.4 scripts/verify-native-fff.mjs
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Provision once on this disposable CI machine
              # Hosted Windows runners are already elevated. Never run this step on a
              # developer machine or turn a failed setup into repeated UAC retries.
              run: |
                  if ($env:GITHUB_ACTIONS -ne 'true') { throw 'CI only' }
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
                  $principal = [Security.Principal.WindowsPrincipal]::new($identity)
                  if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
                      throw 'The disposable runner must already be elevated for sandbox setup.'
                  }
                  & packages/happy-agent/dist/bin/happy-agent-win32-x64.exe sandbox setup
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $status = & packages/happy-agent-supervisor/native/target/release/happy-agent-supervisor.exe --setup-status | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0 -or -not $status.ready) { throw 'Sandbox setup did not complete.' }
                  "HAPPY_WINDOWS_SANDBOX_HOME=$($status.stateDirectory)" >> $env:GITHUB_ENV
                  'HAPPY_WINDOWS_SANDBOX_NO_PROVISION=1' >> $env:GITHUB_ENV
            - name: Verify native sandbox enforcement
              run: pnpm --filter @slopus/happy-agent-supervisor test:native:windows
            - name: Verify both halves of the runner protocol on Windows
              run: pnpm --filter @slopus/happy-agent-compute exec vitest run tests/runner tests/processes/impl/shellCommandArgs.test.ts tests/host/createHostShell.test.ts tests/supervisor/createSupervisorCommand.test.ts
            - name: Verify Windows private ACL setup permits a slow system PowerShell
              run: pnpm --filter @slopus/happy-agent-compute exec vitest run tests/host/CyberFiPrivateDirectoryTimeout.test.ts --maxWorkers=1
            - name: Verify the compiled engine starts from an empty Windows home
              timeout-minutes: 3
              run: |
                  $ErrorActionPreference = 'Stop'
                  $binary = (Resolve-Path -LiteralPath 'packages/happy-agent/dist/bin/happy-agent-win32-x64.exe').Path
                  $runnerTemp = Get-Item -LiteralPath $env:RUNNER_TEMP
                  if ($env:GITHUB_ACTIONS -ne 'true' -or -not $runnerTemp.PSIsContainer -or ($runnerTemp.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                      throw 'This cold-start check requires an isolated CI runner'
                  }
                  if ($env:HAPPY_AGENT_SERVER_SOCKET_PATH -or $env:HAPPY_AGENT_SERVER_TOKEN_PATH) { throw 'An external daemon is configured' }
                  $fixture = Join-Path $runnerTemp.FullName ('cyberfi-engine-cold-' + [Guid]::NewGuid().ToString('N'))
                  if (Test-Path -LiteralPath $fixture) { throw 'The cold-start home is not empty' }
                  $env:HAPPY_HOME_DIR = $fixture
                  try {
                      $clock = [Diagnostics.Stopwatch]::StartNew()
                      $start = & $binary reload
                      $elapsed = $clock.ElapsedMilliseconds
                      if ($LASTEXITCODE -ne 0 -or -not ($start -match '^Daemon is running at ')) { throw 'Cold engine reload did not become ready' }
                      $status = & $binary status
                      if ($LASTEXITCODE -ne 0 -or -not ($status -match '^Daemon is running at ')) { throw 'Cold engine is not answering health' }
                      @{ freshWindowsHome = $true; coldReloadReady = $true; reloadMs = $elapsed; desktopStartupBudgetMs = 75000 } | ConvertTo-Json -Compress
                      if ($elapsed -ge 75000) { throw 'Cold engine reload exceeded the packaged desktop startup budget' }
                  } finally {
                      if (Test-Path -LiteralPath $fixture -PathType Container) { & $binary stop | Out-Null }
                  }
            - name: Exercise the packaged executable
              run: |
                  $binary = 'packages/happy-agent/dist/bin/happy-agent-win32-x64.exe'
                  $version = & $binary --version
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  if ($version -cne "Happy Agent $env:HAPPY_AGENT_RELEASE_VERSION") { throw 'Compiled engine version mismatch' }
                  Write-Output $version
                  node packages/happy-agent/scripts/smoke-binary-transports.mjs $binary
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Exercise installed skills in the actual restricted parent and child
              run: node packages/happy-agent/scripts/cyberfi-smoke-skills.mjs packages/happy-agent/dist/bin/happy-agent-win32-x64.exe
            - name: Retain failed candidate for isolated diagnosis
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: cyberfi-engine-candidate-win32-x64
                  path: packages/happy-agent/dist/bin/happy-agent-win32-x64.exe
                  if-no-files-found: ignore
                  retention-days: 1
            - name: Package the tested executable and checksum
              run: |
                  $name = "happy-agent-$env:HAPPY_AGENT_RELEASE_VERSION-win32-x64.tar.gz"
                  New-Item -ItemType Directory -Force release-assets | Out-Null
                  tar -czf "release-assets/$name" -C packages/happy-agent/dist/bin happy-agent-win32-x64.exe
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $name" | Set-Content "release-assets/$name.sha256" -Encoding ascii
                  Copy-Item cyberfi-tray-branding-proof.json "release-assets/$name.branding-proof.json"
                  Copy-Item cyberfi-windows-sandbox-proof.json "release-assets/$name.sandbox-proof.json"
                  $signing = if ($env:HAPPY_WINDOWS_SIGNING_ENABLED -eq 'true') { 'Signed' } else { 'Unsigned' }
                  "$signing Windows x64 Agent: ``$name`` (SHA-256 ``$hash``)." >> $env:GITHUB_STEP_SUMMARY
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: happy-agent-win32-x64
                  path: release-assets/*
                  if-no-files-found: error
                  retention-days: 7
