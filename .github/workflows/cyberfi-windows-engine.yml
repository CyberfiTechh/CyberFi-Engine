name: Build CyberFi Windows engine

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cyberfi-windows-engine-0.4.122-preview.1
    cancel-in-progress: false

jobs:
    windows:
        if: github.repository == 'CyberfiTechh/CyberFi-Engine' && github.event.repository.private == false && github.ref == 'refs/heads/main'
        uses: ./.github/workflows/build-windows.yml
        permissions:
            contents: read
            id-token: write
        with:
            version: "0.4.122-preview.1"

    publish:
        if: github.repository == 'CyberfiTechh/CyberFi-Engine' && github.event.repository.private == false && github.ref == 'refs/heads/main'
        needs: windows
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: happy-agent-win32-x64
                  path: release-assets
            - name: Verify and publish Windows-only build
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  cd release-assets
                  sha256sum -c happy-agent-0.4.122-preview.1-win32-x64.tar.gz.sha256
                  gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-catalog.json
                  jq -e '[.[][] | select(.tag_name == "v0.4.122-preview.1")] | length == 0' release-catalog.json > /dev/null
                  gh release create v0.4.122-preview.1 --repo "$GITHUB_REPOSITORY" \
                    --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "CyberFi Engine 0.4.122-preview.1" \
                    --notes $'## Düzeltmeler\n- Windows PowerShell komutları ve Python boruları Unicode dosya yollarını ve metni korur.\n- Metin okuma UTF-8 ve BOM işaretli UTF-16’yı tanır. Bilinen eski kodlamalar açıkça seçilebilir.\n\nKaynak: Happy Agent v0.4.114 (MIT), 3d672e414d70804cf9f1b20b44d7243c78e063c3. Üç yerel mimari doğrulaması tamamlanana kadar taslak tutulur.' \
                    happy-agent-0.4.122-preview.1-win32-x64.tar.gz happy-agent-0.4.122-preview.1-win32-x64.tar.gz.sha256
